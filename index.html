<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Exercise</title>
    <link href="./dist/output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="./data.js"></script>
</head>
<body class="bg-gray-100" style="font-family: 'Inter', sans-serif;">

    <div class="max-w-sm mx-auto bg-white h-screen flex flex-col">

        <header class="flex-shrink-0 flex justify-between items-center p-4 bg-white shadow-sm z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-800" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
            <img src="./public/images/telkomsel.png" alt="Eastern Logo" class="h-7">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-6 bg-gray-300 rounded-full p-1 flex items-center">
                    <div class="w-4 h-4 bg-white rounded-full shadow-md"></div>
                </div>
                <img src="https://i.pravatar.cc/150?img=58" alt="Profile Picture" class="h-8 w-8 rounded-full">
            </div>
        </header>

        <main class="flex-grow overflow-y-auto p-4">
            <section>
                <div class="flex justify-between items-start">
                    <div>
                        <h2 class="font-bold text-lg text-gray-900">Performance</h2>
                        <p class="text-xs text-red-500 italic">Note: Rev in Bn</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-gray-500 italic">last update date:</p>
                        <span class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mt-1">2025-08-01</span>
                    </div>
                </div>
                <button class="mt-4 flex items-center space-x-2 bg-teal-500 hover:bg-teal-600 text-white py-2 px-3 rounded-lg text-sm font-semibold">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    <span>Export Excel</span>
                </button>
            </section>
            
            <hr class="my-6 border-t border-gray-200">

            <section>
                <h3 class="font-bold text-lg mb-3 text-gray-900">Regional</h3>
                <div id="regional-container" class="space-y-2">
                    </div>
            </section>
        </main>

        <footer class="flex-shrink-0 bg-white border-t border-gray-200 z-10">
            <div class="p-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-lg text-gray-800">Filters</h3>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L12 14.414V19a1 1 0 01-1.447.894L7 18a1 1 0 01-.553-.894v-3.586L3.293 6.707A1 1 0 013 6V4z" /></svg>
                </div>
                
                <div class="flex justify-between items-start mt-4">
                    <div>
                        <h2 class="font-bold text-lg text-gray-900">Performance</h2>
                        <p class="text-xs text-red-500 italic">Note: Rev in Bn</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-gray-500 italic">last update date:</p>
                        <span class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mt-1">2025-08-01</span>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const regionalContainer = document.getElementById('regional-container');
            if (regionalData && regionalContainer) {
                regionalData.forEach(data => {
                    const accordionHTML = `
                        <div class="accordion-item bg-white rounded-md border border-gray-200">
                            <button class="accordion-header flex justify-between items-center w-full p-3 text-gray-900">
                                <span class="font-semibold">${data.regionName}</span>
                                <svg class="accordion-icon h-5 w-5 transition-transform ${data.isOpen ? '-rotate-180' : ''}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                            </button>
                            <div class="accordion-content px-3 pb-3 ${data.isOpen ? '' : 'hidden'}">
                                <div class="border-t border-gray-200 mt-2 pt-3">
                                    <h4 class="font-semibold text-base">Rev Total</h4>
                                    <div class="grid grid-cols-3 gap-3 mt-2">
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">TARGET</p><p class="font-bold text-base">${data.revTotal.target}</p></div>
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">ACHV%</p><p class="font-bold text-base">${data.revTotal.achv}</p></div>
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">MTD</p><p class="font-bold text-base">${data.revTotal.mtd}</p></div>
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">MOM%</p><p class="font-bold text-base">${data.revTotal.mom}</p></div>
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">YTD %</p><p class="font-bold text-base ${data.revTotal.ytd.startsWith('-') ? 'text-red-500' : ''}">${data.revTotal.ytd}</p></div>
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">YOY%</p><p class="font-bold text-base ${data.revTotal.yoy.startsWith('-') ? 'text-red-500' : ''}">${data.revTotal.yoy}</p></div>
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">RANK YTD</p><p class="font-bold text-base">${data.revTotal.rank}</p></div>
                                    </div>
                                    <h4 class="font-semibold text-base mt-6">Rev Existing</h4>
                                    <div class="grid grid-cols-3 gap-3 mt-2">
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">TARGET</p><p class="font-bold text-base">${data.revExisting.target}</p></div>
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">ACHV%</p><p class="font-bold text-base">${data.revExisting.achv}</p></div>
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">MTD</p><p class="font-bold text-base">${data.revExisting.mtd}</p></div>
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">MOM%</p><p class="font-bold text-base">${data.revExisting.mom}</p></div>
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">YTD %</p><p class="font-bold text-base ${data.revExisting.ytd.startsWith('-') ? 'text-red-500' : ''}">${data.revExisting.ytd}</p></div>
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">YOY%</p><p class="font-bold text-base ${data.revExisting.yoy.startsWith('-') ? 'text-red-500' : ''}">${data.revExisting.yoy}</p></div>
                                        <div class="bg-gray-100 p-2 rounded-lg text-center"><p class="text-xs text-gray-500">RANK YTD</p><p class="font-bold text-base">${data.revExisting.rank}</p></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    regionalContainer.innerHTML += accordionHTML;
                });
            }

            const accordionItems = document.querySelectorAll('.accordion-item');
            accordionItems.forEach(item => {
                const header = item.querySelector('.accordion-header');
                header.addEventListener('click', () => {
                    const content = item.querySelector('.accordion-content');
                    const icon = header.querySelector('.accordion-icon');
                    content.classList.toggle('hidden');
                    icon.classList.toggle('-rotate-180');
                });
            });
        });
    </script>
</body>
</html>
